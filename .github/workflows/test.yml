name: AWS S3 List via OIDC
on:
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  s3-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+' | base64 -d 2>/dev/null)

          echo "$PAYLOAD" | jq '{iss, aud, sub, repository, ref}'
      
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::034703319301:role/GitHubActions
          role-session-name: oidc-demo
        

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: List S3 buckets
        run: aws s3 ls
